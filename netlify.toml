# Netlify configuration file for Power Soft Global Solutions

[build]
  # Publish the current directory where index.html is located
  publish = "."

# Enable Netlify Forms
[build.processing]
  skip_processing = false

# Handle clean URL routing — Netlify Forms POST processing takes priority over this
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
